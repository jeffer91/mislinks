<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Directorio personal de proyectos, sistemas y perfiles de Jefferson Villarreal." />
  <title>Mis Links · Jefferson Villarreal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Inicio">
        <span class="brand-mark">JL</span>
        <span class="brand-copy">
          <strong>Mis Links</strong>
          <small>Jefferson Villarreal</small>
        </span>
      </a>

      <div class="top-stats" aria-label="Resumen">
        <span><strong id="projectCount">3</strong> proyectos</span>
        <span><strong id="linkCount">33</strong> accesos</span>
      </div>
    </header>

    <main>
      <section class="intro-row">
        <div>
          <p class="eyebrow">Panel personal</p>
          <h1>Proyectos y accesos</h1>
          <p>Todo organizado en un solo lugar.</p>
        </div>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar proyecto, perfil o herramienta..." />
          <kbd>/</kbd>
        </label>
      </section>

      <section class="toolbar" aria-label="Filtros y favoritos">
        <div id="filters" class="filters" role="group" aria-label="Filtrar proyectos">
          <button class="filter is-active" data-filter="all" type="button">Todos</button>
          <button class="filter" data-filter="professional" type="button">Profesional</button>
          <button class="filter" data-filter="academic" type="button">Académico</button>
        </div>

        <div class="results">
          <span id="resultsCount"></span>
        </div>
      </section>

      <section class="favorites-strip" id="favoritesSection">
        <span class="favorites-label">Favoritos</span>
        <div id="favoritesGrid" class="favorites-grid"></div>
      </section>

      <section class="projects-section">
        <div id="projectsGrid" class="projects-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <strong>No encontré coincidencias.</strong>
          <span>Prueba con otra palabra o cambia el filtro.</span>
        </div>
      </section>
    </main>
  </div>

  <div id="accessModal" class="modal" hidden>
    <button class="modal-backdrop" type="button" data-close-modal aria-label="Cerrar"></button>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div>
          <span id="modalTag" class="project-tag"></span>
          <h2 id="modalTitle">Accesos</h2>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <div id="modalContent" class="modal-content"></div>
    </section>
  </div>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
