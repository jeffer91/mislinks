<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Directorio personal de proyectos y accesos de Jefferson Villarreal." />
  <title>Mis Links · Jefferson Villarreal</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="assets/favicon.svg" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Mis Links · Inicio">
        <img class="brand-logo" src="assets/logo.svg" alt="Mis Links · Jefferson Villarreal" />
      </a>

      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Buscar proyecto o acceso..." />
        <kbd>/</kbd>
      </label>

      <div class="top-stats">
        <strong id="projectCount">4</strong>
        <span>proyectos</span>
      </div>
    </header>

    <main>
      <section class="favorites-strip" id="favoritesSection">
        <span class="favorites-label">★ Favoritos</span>
        <div id="favoritesGrid" class="favorites-grid"></div>
      </section>

      <section class="projects-heading">
        <div>
          <p class="eyebrow">Panel personal</p>
          <h1>Proyectos</h1>
        </div>
        <span id="resultsCount" class="results"></span>
      </section>

      <section class="projects-section">
        <div id="projectsGrid" class="projects-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <strong>No encontré coincidencias.</strong>
          <span>Prueba con otra palabra.</span>
        </div>
      </section>
    </main>
  </div>

  <div id="accessModal" class="modal" hidden>
    <button class="modal-backdrop" type="button" data-close-modal aria-label="Cerrar"></button>
    <section id="modalPanel" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div class="modal-heading">
          <button id="modalBack" class="modal-back" type="button" hidden>← Volver</button>
          <span id="modalProject" class="modal-project">Proyecto</span>
          <h2 id="modalTitle">Accesos</h2>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
      </header>
      <div id="modalContent" class="modal-content"></div>
    </section>
  </div>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
